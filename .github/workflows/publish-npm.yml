name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run build
          npm run check
          npm run test:version
          npm run test:settings
          npm run test:wallpaper-switch
          npm run test:wallpaper-renderer

      - name: Select npm distribution tag
        id: npm-tag
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"tag="+(p.version.includes("-")?"next":"latest")+"\n");'

      - name: Publish package
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}
